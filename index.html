<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Resume Match (by London Chamberlain)</h1>

        <label for="resumeInput" class="form-label fs-5">Paste Your Resume Text:</label>
        <textarea id="resumeInput" rows="6" class="form-control"></textarea>

        <label for="jobTitle" class="form-label fs-5">Job Title:</label>
        <input type="text" id="jobTitle" class="form-control">

        <label for="companyName" class="form-label fs-5">Company Name:</label>
        <input type="text" id="companyName" class="form-control">

        <label for="jobDesc" class="form-label fs-5">Job Application Description:</label>
        <textarea id="jobDesc" rows="6" class="form-control"></textarea>

        <button class="btn btn-primary" onclick="analyzeResume()">Submit for Recommendations</button>

        <br>
        <h2>Recommendations:</h2>
        <pre id="results"></pre>
    </div>

    <script>
        function analyzeResume() {
            const resume = document.getElementById('resumeInput').value.toLowerCase();
            const jobTitle = document.getElementById('jobTitle').value.toLowerCase();
            const companyName = document.getElementById('companyName').value.toLowerCase();
            const jobDesc = document.getElementById('jobDesc').value.toLowerCase();

            const stopWords = new Set([
                ...jobTitle.split(/\s+/), 
                ...companyName.split(/\s+/),
                "and", "the", "is", "in", "to", "a", "of", "for", "on", "with", "as", "used", "are", "you", "your", "we", "our", "by", "an", "be", "or", "at", "from", "it", "that", "this", "which", "have", "has", "was", "were", "but", "not", "can", "will", "should", "would", "may", "might", "so", "if", "no", "yes", "up", "down", "out", "over", "under", "more", "most", "some", "such", "any", "other", "all", "each", "every", "than", "then", "when", "where", "why", "how"
            ]);

            const jobWords = jobDesc.match(/\b[a-z]+\b/g).filter(word => !stopWords.has(word));
            const resumeWords = new Set(resume.match(/\b[a-z]+\b/g));

            const wordFreq = {};
            jobWords.forEach(word => wordFreq[word] = (wordFreq[word] || 0) + 1);

            const sortedWords = Object.entries(wordFreq).sort((a, b) => b[1] - a[1]).slice(0, 10);

            let results = "Most frequent words in job application:\n";
            sortedWords.forEach(([word, freq]) => results += `${word}: ${freq}\n`);

            const missingWords = sortedWords.map(([word]) => word).filter(word => !resumeWords.has(word));

            if (missingWords.length > 0) {
                results += "\nConsider adding these words to your resume:\n" + missingWords.join(", ") + "\n";
            } else {
                results += "\nYour resume already contains the relevant words.\n";
            }

            document.getElementById('results').textContent = results;
        }
    </script>
</body>
</html>
