<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styling/style.css">
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Resume Match</h1>
            <p class="text-muted">A tool made by <a href="https://londonchamberlain.com" target="_blank">London Chamberlain</a></p>
        </div>

        <div class="card p-4 shadow-sm">
            <label for="resumeInput" class="form-label">Paste Your Resume:</label>
            <textarea id="resumeInput" rows="5" class="form-control mb-3" oninput="validateForm()"></textarea>

            <div class="row g-2">
                <div class="col-md-6">
                    <label for="jobTitle" class="form-label">Job Title:</label>
                    <input type="text" id="jobTitle" class="form-control" oninput="validateForm()">
                </div>
                <div class="col-md-6">
                    <label for="companyName" class="form-label">Company Name:</label>
                    <input type="text" id="companyName" class="form-control" oninput="validateForm()">
                </div>
            </div>

            <label for="jobDesc" class="form-label mt-3">Job Description:</label>
            <textarea id="jobDesc" rows="5" class="form-control mb-4" oninput="validateForm()"></textarea>

            <button id="submitBtn" class="btn btn-primary w-100" onclick="analyzeResume()" disabled>Submit for Recommendations</button>
        </div>

        <div class="card mt-4 p-3 shadow-sm">
            <h4 class="fw-bold">Recommendations:</h4>
            <pre id="results" class="p-2 bg-light rounded"></pre>
        </div>
    </div>

    <script>
        function validateForm() {
            const resume = document.getElementById('resumeInput').value.trim();
            const jobTitle = document.getElementById('jobTitle').value.trim();
            const companyName = document.getElementById('companyName').value.trim();
            const jobDesc = document.getElementById('jobDesc').value.trim();
            const submitBtn = document.getElementById('submitBtn');
        
            // Check if all fields are filled
            if (resume && jobTitle && companyName && jobDesc) {
                submitBtn.disabled = false;
                submitBtn.classList.add("enabled");  // Adds hover effect
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.remove("enabled"); // Removes hover effect
            }
        }

        function analyzeResume() {
            const resume = document.getElementById('resumeInput').value.toLowerCase();
            const jobTitle = document.getElementById('jobTitle').value.toLowerCase();
            const companyName = document.getElementById('companyName').value.toLowerCase();
            const jobDesc = document.getElementById('jobDesc').value.toLowerCase();

            const stopWords = new Set([
                ...jobTitle.split(/\s+/), 
                ...companyName.split(/\s+/),
                "and", "career", "top", "industry", "about", "potential", "about", "intern", "interns", "summer", "ideal", "candidate", "internship", "candidates", "the", 
                "is", "in", "to", "a", "of", "for", "on", "with", "as", "used", "are", "you", "your", "we", "our", 
                "by", "an", "be", "or", "at", "from", "it", "that", "this", "which", "have", "has", "was", "were", 
                "but", "not", "can", "will", "should", "would", "may", "might", "so", "if", "no", "yes", "up", "down", 
                "out", "over", "under", "more", "most", "some", "such", "any", "other", "all", "each", "every", "than", 
                "then", "when", "where", "why", "how"
            ]);

            const jobWords = jobDesc.match(/\b[a-z]+\b/g).filter(word => !stopWords.has(word));
            const resumeWords = new Set(resume.match(/\b[a-z]+\b/g));

            const wordFreq = {};
            jobWords.forEach(word => wordFreq[word] = (wordFreq[word] || 0) + 1);

            const sortedWords = Object.entries(wordFreq).sort((a, b) => b[1] - a[1]).slice(0, 10);

            let results = "Most frequent words in job application:\n";
            sortedWords.forEach(([word, freq]) => results += `${word}: ${freq}\n`);

            const missingWords = sortedWords.map(([word]) => word).filter(word => !resumeWords.has(word));

            if (missingWords.length > 0) {
                results += "\nConsider adding these words to your resume:\n" + missingWords.join(", ") + "\n";
            } else {
                results += "\nYour resume already contains the relevant words.\n";
            }

            document.getElementById('results').textContent = results;
        }
    </script>

    <script src="../footer/footer.js"></script>
</body>
</html>
